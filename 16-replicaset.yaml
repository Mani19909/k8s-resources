apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  # these lables belongs to replicaset resource  
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
      app: nginx
  template:
    metadata:
      lables:
        tier: frontend
        app: nginx
        project: some-project
    spec:
      containers:
      - name: nginx
        image: nginx
     