apiVersion: v1
kind: Pod
metadata: 
  name: pod-1
  labels:
    name: pod-1
    purpose: affinity
spec:
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: Always # keep this as always
---
apiVersion: v1
kind: Pod
metadata: 
  name: pod-2
  labels:
    name: pod-1
    purpose: affinity
spec:
  affinity:
    podAffinity:    
      requiredDuringSchedulingIgnoredDuringExecution:   
      - labelSelectorTerms:    
          matchExpressions:   
          - key: name   
            operator: In    
            values: 
            - pod-1   
        topologyKey: topology.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: Always # keep this as always
---
