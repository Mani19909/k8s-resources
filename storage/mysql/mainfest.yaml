apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: expense

spec:
  serviceName: mysql
  replicas: 2

  selector:
    matchLabels:
      component: mysql
      project: expense
      tier: db

  template:
    metadata:
      labels:
        component: mysql
        project: expense
        tier: db

    spec:
      containers:
        - name: mysql

          image: joindevops/mysql:v1.0

          ports:
            - containerPort: 3306
              name: mysql

          volumeMounts:
            - name: mysql
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: expense-ebs

        resources:
          requests:
            storage: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: expense

spec:
  clusterIP: None

  selector:
    component: mysql
    project: expense
    tier: db

  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306