apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  storageClassName: "executable-ebs"
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic
  labels:
    purpose: ebs-dynamic
    project: expense
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1c
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: ebs-dynamic
